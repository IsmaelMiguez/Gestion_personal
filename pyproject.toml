[project]
name = "rrhh-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-htmx>=1.29.0",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "uv>=0.13.5",
]

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["I"]

[tool.ruff.format]
exclude = ["**/migrations/*.py"]
