<div class="d-flex gap-2 mb-2"><button class="btn btn-outline-secondary btn-sm" type="button" data-check-all="worker-options">Todos</button><button class="btn btn-link btn-sm" type="button" data-uncheck-all="worker-options">Ninguno</button></div>
{% for choice in form.employees %}<div class="form-check">{{ choice.tag }}<label class="form-check-label" for="{{ choice.id_for_label }}">{{ choice.choice_label }}</label></div>{% empty %}<p class="text-body-secondary mb-0">Selecciona empresas para cargar sus trabajadores. Si no hay trabajadores, registra sus relaciones laborales.</p>{% endfor %}
